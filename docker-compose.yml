version: "3.9"

services:

  postgres:

    image: postgres:17

    container_name: hotelos-db

    restart: always

    environment:

      POSTGRES_DB: hotelos

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:8

    container_name: hotelos-redis

    restart: always

    ports:

      - "6379:6379"

  api:

    build: ./backend

    container_name: hotelos-api

    ports:

      - "8000:8000"

    depends_on:

      - postgres

      - redis

    volumes:

      - ./backend:/app

volumes:

  postgres_data: